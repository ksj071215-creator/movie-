<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화 상세 정보 - 클론코딩</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 헤더 / 상단 바 -->
  <header class="navbar">
    <div class="logo">MOVIE FLIX</div>
    <nav>
      <a href="#">홈</a>
      <a href="#">영화</a>
      <a href="#">보관함</a>
    </nav>
  </header>

  <!-- 메인 히어로 섹션 (핵심기능 1) -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="movie-title">인터스텔라 (Interstellar)</h1>
      <p class="movie-desc">
        세계 각국의 정부와 경제가 완전히 붕괴된 미래. 인류의 시급한 문제를 해결하기 위해 시공간의 틈을 찾아 우주를 탐험하는 인류의 마지막 도전이 시작된다.
      </p>
      <div class="hero-buttons">
        <button class="btn btn-primary">▶ 재생하기</button>
        <button class="btn btn-secondary">ⓘ 상세 정보</button>
      </div>
    </div>
  </section>

  <!-- 영화 정보 & 관련 추천 카드 (핵심기능 2) -->
  <main class="container">
    <h2>관련 추천 작품</h2>
    <div class="grid-container">
      <div class="card">
        <img src="https://picsum.photos/300/400?random=1" alt="영화 포스터 1">
        <h3>인셉션</h3>
        <p>드림 스틸러의 꿈속 침투 작전</p>
      </div>
      <div class="card">
        <img src="https://picsum.photos/300/400?random=2" alt="영화 포스터 2">
        <h3>마션</h3>
        <p>화성에서 홀로 살아남기</p>
      </div>
      <div class="card">
        <img src="https://picsum.photos/300/400?random=3" alt="영화 포스터 3">
        <h3>그래비티</h3>
        <p>우주 고립극에서 빠져나가기</p>
      </div>
      <div class="card">
        <img src="https://picsum.photos/300/400?random=4" alt="영화 포스터 4">
        <h3>테넷</h3>
        <p>시간을 거스르는 인버전 작전</p>
      </div>
    </div>
  </main>

</body>
</html>
